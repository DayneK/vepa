name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Gate the deploy on the full test suite. 951 unit + audit tests cover
      # the law contract, solver, engines and subsystems; a regression must not
      # reach gh-pages green.
      - run: npm ci
      - run: npm test

      # Contract gates: the generated spec tree must match its source, and the
      # repository law/provenance/signoff manifests must be internally valid.
      - name: Verify spec + repository contracts
        run: npm run repository:check

      # ARP-CC: the five repository controls (syntax, gravity-backend envelope,
      # audit + artifact inventories) and a no-drift check on generated files.
      - name: Repository controls
        run: |
          npm run syntax-check
          npm run bench:backends
          npm run audit:inventory
          npm run artifact:inventory
          git diff --exit-code

      # FSM-1: browser e2e (boot, law toggle, render frame, worker tick,
      # mechanics worker state, timeline dashboard) in headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser e2e
        run: npm run test:e2e

      # Build the v4 app (repo root) for the /vepa/ project page.
      - run: npm run build
        env:
          VITE_BASE: /vepa/

      # Deploy to the gh-pages branch (Pages source, legacy build type).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
